# Example local override. Copy to docker-compose.override.yaml — which is
# gitignored — and edit it there. Compose merges that file automatically, no
# flags needed.
#
# Two things belong in an override and nowhere else: paths that exist on one
# person's disk, and settings that describe one deployment rather than the
# stack. Keeping them here is what lets docker-compose.yaml stay runnable by
# someone who has neither.

services:
  openwebui-knowledge:
    # 1. Host directories the path-upload tool may read. See "Reading files off
    #    disk" in README.md — the container-side path then goes in
    #    OPENWEBUI_UPLOAD_ROOTS, and the default of empty refuses every path.
    volumes:
      - /absolute/host/dir:/uploads:ro

  openwebui:
    # 2. A local inference engine.
    #
    #    On macOS the engine runs on the HOST, never in a container: Docker
    #    Desktop is a Linux VM with no access to Metal, so an engine started
    #    inside compose falls back to CPU and stays there — several times
    #    slower, with nothing in the logs to say why. The container reaches the
    #    host engine by name instead. That name resolves out of the box on
    #    macOS and Windows; the extra_hosts line is what makes it resolve on
    #    Linux too, and is harmless everywhere else.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Ollama binds 127.0.0.1 by default, which no container can reach. Start
      # it with OLLAMA_HOST=0.0.0.0:11434 — and note what that means: the port
      # is then reachable from the local network as well.
      - ENABLE_OLLAMA=true
      - OLLAMA_BASE_URL=http://host.docker.internal:11434

      # 3. A deployment that must not talk to a vendor at all.
      #
      #    Access control on the model list is not enough here: a picker that
      #    still lists the upstream is one misclick from sending a document to
      #    it. ENABLE_OPENAI_API=false makes the connector absent rather than
      #    configured-and-unused, which is the difference between a policy and
      #    a guarantee.
      # - ENABLE_OPENAI_API=false
      #
      #    OFFLINE_MODE also blocks fetching the embedding model, so turn it on
      #    only after a first start has cached it.
      # - OFFLINE_MODE=true
      - ANONYMIZED_TELEMETRY=false
      - DO_NOT_TRACK=true
      - SCARF_NO_ANALYTICS=true

      # 4. Embeddings on the host engine instead of this container's CPU.
      #
      #    This is not a drop-in speedup: the dimension still matches, but the
      #    vectors are produced differently, so existing ones and new ones stop
      #    being comparable and retrieval quietly degrades. An existing
      #    collection has to be rebuilt with tools/reindex.py. Do it as its own
      #    step, with nothing else changing at the same time.
      # - RAG_EMBEDDING_ENGINE=ollama
      # - RAG_EMBEDDING_MODEL=bge-m3

  vector-db:
    environment:
      # Chroma reports usage to its vendor unless told otherwise.
      - ANONYMIZED_TELEMETRY=FALSE

# Services of your own — a model router, a scheduler, an MCP proxy — are better
# kept in a compose project of their own that joins this one's network as
# external, so this repo goes on defining one thing. The network is named after
# COMPOSE_PROJECT_NAME, so work-rag_default unless you changed it:
#
#   networks:
#     work_rag:
#       external: true
#       name: work-rag_default
