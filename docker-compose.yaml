services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  vector-db:
    image: chromadb/chroma:1.5.9
    # No authentication of its own; OpenWebUI reaches it over the compose network.
    ports:
      - "127.0.0.1:${CHROMA_BIND_PORT}:8000"
    environment:
      - IS_PERSISTENT=TRUE
    volumes:
      # /data is the image's own persist_path; on any other path the volume stays
      # empty and the vectors die with the container. Re-check on a tag bump.
      - chroma_data:/data
    restart: unless-stopped

  openwebui-knowledge:
    build:
      context: ./mcp/openwebui-knowledge
    depends_on:
      openwebui:
        condition: service_healthy
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8787
      - OPENWEBUI_BASE_URL=http://openwebui:8080
      - OPENWEBUI_API_KEY=${OPENWEBUI_API_KEY}
      # (optional) specify a default collection to sync with, otherwise it will sync with the default collection of the OpenWebUI instance  
      - OPENWEBUI_DEFAULT_COLLECTION=${OPENWEBUI_DEFAULT_COLLECTION}
      # Calibrated per corpus, not per stack — see .env.example.
      - OPENWEBUI_MIN_SCORE=${OPENWEBUI_MIN_SCORE:-0.76}
      - OPENWEBUI_TIMEOUT_MS=${OPENWEBUI_TIMEOUT_MS:-20000}
      - OPENWEBUI_UPLOAD_SETTLE_MS=${OPENWEBUI_UPLOAD_SETTLE_MS:-45000}
      - OPENWEBUI_REPLACE_DEADLINE_MS=${OPENWEBUI_REPLACE_DEADLINE_MS:-900000}
      # Empty refuses every request carrying an Origin; MCP clients send none.
      - MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS:-}
      # Colon-separated directories upload_document_from_path may read, as seen
      # from inside this container. Empty by default, which refuses every path:
      # a path parameter is otherwise "ingest any file the server can reach".
      # Mount the host directory first — the container cannot see your disk.
      - OPENWEBUI_UPLOAD_ROOTS=${OPENWEBUI_UPLOAD_ROOTS:-}
      - OPENWEBUI_UPLOAD_MAX_BYTES=${OPENWEBUI_UPLOAD_MAX_BYTES:-33554432}
    # Host directories are mounted in docker-compose.override.yaml, which is
    # gitignored so this file carries nobody's local paths. Compose merges it
    # automatically.
    restart: unless-stopped

  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.11.4
    depends_on:
      postgres:
        condition: service_healthy
      vector-db:
        # No healthcheck: the image has neither curl nor python to probe with.
        condition: service_started
    ports:
      - "${WEBUI_BIND_PORT}:8080"
    volumes:
      - open_webui_data:/app/backend/data
    environment:
      - DATABASE_URL=${OPENWEBUI_DATABASE_URL}
      # fixed signing key: without it every restart invalidates all sessions
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - ENABLE_PERSISTENT_CONFIG=${OPENWEBUI_ENABLE_PERSISTENT_CONFIG}

      - VECTOR_DB=chroma
      - CHROMA_HTTP_HOST=vector-db
      - CHROMA_HTTP_PORT=8000
      - CHROMA_TENANT=default_tenant
      - CHROMA_DATABASE=default_database

      # multilingual, 1024d. Persistent config already holds it; pinning it here
      # too means a deploy without that config cannot silently fall back to the
      # image default (English, 384d) and fail every write on the dimension.
      - RAG_EMBEDDING_MODEL=BAAI/bge-m3

      - OPENAI_API_BASE_URL=${UPSTREAM_OPENAI_BASE_URL}
      - OPENAI_API_KEY=${UPSTREAM_OPENAI_API_KEY}

      - WEBUI_ADMIN_EMAIL=${WEBUI_ADMIN_EMAIL}
      - WEBUI_ADMIN_PASSWORD=${WEBUI_ADMIN_PASSWORD}
      - WEBUI_ADMIN_NAME=${WEBUI_ADMIN_NAME}
      - WEBUI_URL=${WEBUI_URL}

      - ENABLE_OLLAMA=false
    restart: unless-stopped

  # pipelines:
  #   image: ghcr.io/open-webui/pipelines:main
