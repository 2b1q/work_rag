  #     - "127.0.0.1:9099:9099"
  #   volumes:
  #     - pipelines_data:/app/pipelines
  #   environment:
  #     - PIPELINES_API_KEY=${PIPELINES_API_KEY}
  #     - PIPELINES_MODELS=${PIPELINES_MODELS}
  #     # Provide your upstream LLM here
  #     - OPENAI_API_KEY=${UPSTREAM_OPENAI_API_KEY}
  #     - OPENAI_BASE_URL=${UPSTREAM_OPENAI_BASE_URL}
  #   restart: unless-stopped
  
volumes:
  pg_data:
  chroma_data:
  open_webui_data:
